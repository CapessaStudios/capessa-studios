<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Capessa Studios — Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    :root {
      --bg:#0f1115; --bg2:#171a21; --bg3:#1f232c; --line:#2a2f3a;
      --gold:#D4AF37; --text:#eef0f3; --text2:#a8adb8; --text3:#6b7280;
      --green:#4ADE80; --blue:#60A5FA; --red:#f87171;
      --sidebar-w: 210px;
      --sidebar-collapsed: 56px;
      --header-h: 52px;
      --radius: 10px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: -apple-system,'Segoe UI',Roboto,Arial,sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── LOGIN ─────────────────────────────────────────────── */
    #login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .login-box { background: var(--bg2); border: 1px solid var(--line); border-radius: 16px; padding: 36px 32px; width: 100%; max-width: 380px; }
    .login-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .login-logo i { color: var(--gold); font-size: 1.4rem; }
    .login-logo h1 { font-size: 18px; letter-spacing: 1px; }
    .login-logo h1 span { color: var(--gold); }
    .login-sub { color: var(--text3); font-size: 13px; margin-bottom: 28px; }
    .err-msg { color: var(--red); font-size: 13px; margin-top: 12px; min-height: 18px; }
    .divider { display: flex; align-items: center; gap: 10px; margin: 14px 0; }
    .divider span { font-size: 12px; color: var(--text3); }
    .divider-line { flex: 1; height: 1px; background: var(--line); }

    /* ── HEADER ───────────────────────────────────────────── */
    #app-header {
      height: var(--header-h); padding: 0 16px 0 12px;
      border-bottom: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; background: var(--bg); z-index: 40;
      gap: 10px;
    }
    .header-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .hamburger {
      background: transparent; border: none; color: var(--text2);
      font-size: 1.1rem; width: 36px; height: 36px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0; transition: background .15s, color .15s;
    }
    .hamburger:hover { background: var(--bg3); color: var(--text); }
    .header-brand { font-size: 14px; letter-spacing: 0.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .header-brand span { color: var(--gold); }
    .header-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .user-email { font-size: 12px; color: var(--text3); max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    @media (max-width: 480px) { .user-email { display: none; } .header-brand { font-size: 13px; } }

    /* ── APP SHELL ────────────────────────────────────────── */
    #admin-app { display: none; }
    .app-body {
      display: flex;
      height: calc(100vh - var(--header-h));
      position: relative;
    }

    /* ── SIDEBAR ──────────────────────────────────────────── */
    #sidebar {
      width: var(--sidebar-w);
      border-right: 1px solid var(--line);
      display: flex; flex-direction: column;
      flex-shrink: 0;
      background: var(--bg);
      overflow: hidden;
      transition: width .22s ease;
      position: relative;
      z-index: 30;
    }
    #sidebar.collapsed { width: var(--sidebar-collapsed); }

    /* Mobile: sidebar como drawer sobreposto */
    @media (max-width: 640px) {
      #sidebar {
        position: fixed;
        top: var(--header-h);
        left: 0;
        height: calc(100vh - var(--header-h));
        width: var(--sidebar-w) !important;
        transform: translateX(-100%);
        box-shadow: 4px 0 24px rgba(0,0,0,.5);
        transition: transform .22s ease;
      }
      #sidebar.mobile-open {
        transform: translateX(0);
      }
      #sidebar-overlay {
        display: none;
        position: fixed; inset: 0;
        top: var(--header-h);
        background: rgba(0,0,0,.5);
        z-index: 29;
      }
      #sidebar-overlay.show { display: block; }
    }

    .nav-section {
      padding: 10px 0 6px;
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
    }
    .nav-label {
      font-size: 10px; letter-spacing: 0.6px; text-transform: uppercase;
      color: var(--text3); padding: 8px 16px 4px;
      white-space: nowrap; overflow: hidden;
      transition: opacity .15s;
    }
    #sidebar.collapsed .nav-label { opacity: 0; pointer-events: none; }

    .nav-btn {
      width: 100%; text-align: left;
      background: transparent; border: none; border-radius: 0;
      color: var(--text2);
      padding: 0 10px;
      height: 42px;
      display: flex; align-items: center; gap: 11px;
      font-size: 13px; font-weight: 500; cursor: pointer;
      transition: background .12s, color .12s;
      white-space: nowrap; overflow: hidden;
    }
    .nav-btn:hover { background: var(--bg2); color: var(--text); }
    .nav-btn.active { background: var(--bg3); color: var(--gold); }
    .nav-btn.active { border-left: 3px solid var(--gold); }
    .nav-btn i.nav-icon {
      font-size: 15px; width: 24px; text-align: center; flex-shrink: 0;
    }
    .nav-btn-label {
      overflow: hidden; text-overflow: ellipsis;
      transition: opacity .15s, max-width .22s;
      max-width: 140px;
    }
    #sidebar.collapsed .nav-btn-label { opacity: 0; max-width: 0; }
    #sidebar.collapsed .nav-btn { justify-content: center; padding: 0; }
    #sidebar.collapsed .nav-btn.active { border-left: 2px solid var(--gold); }

    /* Tooltip quando collapsed */
    #sidebar.collapsed .nav-btn { position: relative; }
    #sidebar.collapsed .nav-btn::after {
      content: attr(data-tooltip);
      position: absolute; left: calc(100% + 8px); top: 50%;
      transform: translateY(-50%);
      background: var(--bg3); border: 1px solid var(--line);
      color: var(--text); font-size: 12px; padding: 4px 10px;
      border-radius: 6px; white-space: nowrap;
      pointer-events: none; opacity: 0; transition: opacity .15s;
      z-index: 50;
    }
    #sidebar.collapsed .nav-btn:hover::after { opacity: 1; }

    .visit-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(212,175,55,.12);
      border: 1px solid rgba(212,175,55,.3);
      color: var(--gold);
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all .2s;
      width: calc(100% - 24px);
      margin: 8px 12px 0;
      white-space: nowrap;
      overflow: hidden;
    }
    .visit-btn:hover {
      background: rgba(212,175,55,.22);
      border-color: var(--gold);
    }
    #sidebar.collapsed .visit-btn {
      width: 36px;
      padding: 9px 0;
      justify-content: center;
      margin: 8px auto 0;
      border-radius: 8px;
    }
    #sidebar.collapsed .visit-btn .vb-label { display: none; }
    .sidebar-footer {
      border-top: 1px solid var(--line);
      padding: 8px 10px;
      display: flex; justify-content: flex-end;
    }
    #sidebar.collapsed .sidebar-footer { justify-content: center; }
    .collapse-btn {
      background: transparent; border: none; color: var(--text3);
      width: 32px; height: 32px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 14px;
      transition: background .15s, color .15s;
    }
    .collapse-btn:hover { background: var(--bg3); color: var(--text); }

    /* ── MAIN ─────────────────────────────────────────────── */
    #main-content {
      flex: 1; overflow-y: auto;
      padding: 24px 28px;
      min-width: 0;
    }
    @media (max-width: 480px) { #main-content { padding: 16px; } }

    /* ── TOOLBAR ──────────────────────────────────────────── */
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 12px; flex-wrap: wrap; }
    .toolbar h2 { font-size: 18px; }
    .toolbar-actions { display: flex; gap: 8px; }

    /* ── ITEM ROWS ────────────────────────────────────────── */
    .item-row {
      display: flex; align-items: center; gap: 14px;
      background: var(--bg2); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 10px 14px; margin-bottom: 8px;
    }
    .item-thumb {
      width: 40px; height: 40px; border-radius: 8px;
      background: var(--bg3);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; color: var(--text3); flex-shrink: 0; font-weight: 700;
    }
    .item-info { flex: 1; min-width: 0; }
    .item-info b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-info span { font-size: 12px; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
    .item-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .empty {
      color: var(--text3); padding: 48px 24px; text-align: center;
      border: 1px dashed var(--line); border-radius: 12px;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
    }
    .empty i { font-size: 2rem; opacity: 0.4; color: var(--gold); }
    .loading { color: var(--text3); padding: 48px; text-align: center; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .loading i { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── BADGE ────────────────────────────────────────────── */
    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; border: 1px solid; margin-left: 6px; }
    .badge.released { color:#4ADE80; background:#4ADE8015; border-color:#4ADE8030; }
    .badge.beta     { color:#60A5FA; background:#60A5FA15; border-color:#60A5FA30; }
    .badge.dev      { color:#F59E0B; background:#F59E0B15; border-color:#F59E0B30; }
    .badge.soon     { color:#A78BFA; background:#A78BFA15; border-color:#A78BFA30; }

    /* ── BUTTONS ──────────────────────────────────────────── */
    button { cursor: pointer; font-family: inherit; border: none; border-radius: 8px; padding: 9px 15px; font-size: 13px; font-weight: 600; transition: .15s; }
    .btn-primary  { background: var(--gold); color: #1a1a1a; display: inline-flex; align-items: center; gap: 6px; }
    .btn-primary:hover { filter: brightness(1.1); }
    .btn-secondary { background: var(--bg3); color: var(--text); border: 1px solid var(--line); }
    .btn-secondary:hover { background: #262b35; }
    .btn-danger { background: transparent; color: var(--red); border: 1px solid rgba(248,113,113,.3); padding: 6px 10px; font-size: 12px; display: inline-flex; align-items: center; gap: 5px; }
    .btn-danger:hover { background: rgba(248,113,113,.08); }
    .btn-edit   { background: transparent; color: var(--blue); border: 1px solid rgba(96,165,250,.3); padding: 6px 10px; font-size: 12px; display: inline-flex; align-items: center; gap: 5px; }
    .btn-edit:hover { background: rgba(96,165,250,.08); }
    .btn-icon { background: transparent; border: none; color: var(--text3); width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; padding: 0; }
    .btn-icon:hover { background: var(--bg3); color: var(--text); }
    .img-field-wrap { display:flex; gap:8px; align-items:center; }
    .img-field-wrap input { flex:1; }
    .btn-upload { background:var(--bg3); border:1px solid var(--line); color:var(--text2); border-radius:8px; padding:0 12px; height:38px; font-size:12px; white-space:nowrap; display:flex; align-items:center; gap:6px; cursor:pointer; }
    .btn-upload:hover { border-color:var(--gold); color:var(--gold); }
    .btn-upload.uploading { opacity:.6; pointer-events:none; }
    .img-preview { width:48px; height:48px; object-fit:cover; border-radius:6px; border:1px solid var(--line); flex-shrink:0; display:none; }
    .img-preview.show { display:block; }
    .screens-list { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
    .screens-list img { width:80px; height:52px; object-fit:cover; border-radius:6px; border:1px solid var(--line); }
    .upload-progress { font-size:11px; color:var(--gold); margin-top:4px; display:none; }
    .upload-progress.show { display:block; }
    .link-rows { display:flex; flex-direction:column; gap:8px; margin-bottom:8px; }
    .link-row { display:grid; grid-template-columns:1fr 1fr 90px 90px auto; gap:6px; align-items:center; background:var(--bg3); border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
    .link-row input, .link-row select { background:var(--bg2); border:1px solid var(--line); border-radius:6px; padding:5px 8px; color:var(--text1); font-size:12px; width:100%; }
    .link-row select { cursor:pointer; }
    .link-row-del { background:transparent; border:none; color:var(--red); cursor:pointer; padding:4px 6px; border-radius:6px; font-size:13px; flex-shrink:0; }
    .link-row-del:hover { background:rgba(248,113,113,.1); }
    .btn-add-link { background:transparent; border:1px dashed var(--line); color:var(--text2); border-radius:8px; padding:7px 14px; font-size:12px; cursor:pointer; display:flex; align-items:center; gap:6px; width:100%; justify-content:center; }
    .btn-add-link:hover { border-color:var(--gold); color:var(--gold); }
    @media(max-width:600px) { .link-row { grid-template-columns:1fr 1fr; } .link-row .link-col-icon,.link-row .link-col-cta { display:none; } }

    /* ── MODAL ────────────────────────────────────────────── */
    .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 100; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 24px 12px; }
    .modal-bg.open { display: flex; }
    .modal { background: var(--bg2); border: 1px solid var(--line); border-radius: 14px; padding: 24px; width: 100%; max-width: 660px; }
    .modal-header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
    .modal-header h3 { font-size: 16px; flex: 1; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--line); }

    /* ── FORM ─────────────────────────────────────────────── */
    .field { margin-bottom: 13px; }
    .field label { display: block; font-size: 11px; color: var(--text2); margin-bottom: 5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; }
    .field small  { display: block; color: var(--text3); font-size: 11px; margin-top: 4px; }
    input, select, textarea { width: 100%; background: var(--bg3); border: 1px solid var(--line); color: var(--text); padding: 8px 12px; border-radius: 8px; font-size: 13px; font-family: inherit; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 2px rgba(212,175,55,.15); }
    input[readonly] { opacity: .5; cursor: not-allowed; }
    textarea { resize: vertical; min-height: 72px; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    @media (max-width: 520px) { .row2, .row3 { grid-template-columns: 1fr; } }

    /* ── CHECKBOX CHIPS ───────────────────────────────────── */
    .check-group { display: flex; flex-wrap: wrap; gap: 8px; }
    .check-chip { display: flex; align-items: center; gap: 6px; background: var(--bg3); border: 1px solid var(--line); border-radius: 20px; padding: 5px 12px; font-size: 12px; cursor: pointer; transition: .15s; user-select: none; }
    .check-chip input { width: auto; margin: 0; accent-color: var(--gold); }
    .check-chip:has(input:checked) { border-color: var(--gold); color: var(--gold); background: rgba(212,175,55,.08); }
    .inline-check { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--text); }
    .inline-check input { width: auto; accent-color: var(--gold); }
    .form-section { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--gold); margin: 18px 0 10px; border-top: 1px solid var(--line); padding-top: 14px; font-weight: 700; display: flex; align-items: center; gap: 7px; }
    .form-section i { font-size: 12px; }

    /* ── SETTINGS ─────────────────────────────────────────── */
    .settings-block { background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 14px; }
    .settings-block-header { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
    .settings-block-header i { color: var(--gold); font-size: 14px; }
    .settings-block-header h3 { font-size: 13px; color: var(--gold); text-transform: uppercase; letter-spacing: 0.5px; }

    /* ── SOCIAL LIST EDITOR ───────────────────────────────── */
    .social-row-header {
      display: grid;
      grid-template-columns: 36px 1fr 1fr 1.4fr 32px;
      gap: 8px; padding: 0 4px 6px;
      font-size: 10px; text-transform: uppercase; letter-spacing: .4px;
      color: var(--text3); font-weight: 700;
    }
    .social-row {
      display: grid;
      grid-template-columns: 36px 1fr 1fr 1.4fr 32px;
      gap: 8px; align-items: center;
      background: var(--bg3); border: 1px solid var(--line);
      border-radius: 8px; padding: 6px 8px; margin-bottom: 6px;
    }
    .social-row-icon {
      width: 36px; height: 36px; border-radius: 7px;
      background: var(--bg); border: 1px solid var(--line);
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; color: var(--gold); flex-shrink: 0;
    }
    .social-inp-label, .social-inp-url {
      background: var(--bg2); min-width: 0;
    }
    /* Wrapper do selector de ícone — ícone preview + select numa linha */
    .social-icon-wrap {
      display: flex; align-items: center; gap: 6px;
      background: var(--bg2); border: 1px solid var(--line);
      border-radius: 7px; padding: 0 8px 0 10px;
      min-width: 0; height: 36px;
    }
    .social-icon-preview-sel {
      font-size: 14px; color: var(--gold); flex-shrink: 0; width: 16px; text-align: center;
    }
    .social-inp-icon {
      background: transparent; border: none; outline: none;
      color: var(--text); font-size: 12px; flex: 1; min-width: 0;
      cursor: pointer; padding: 0;
    }
    .social-inp-icon option { background: var(--bg2); color: var(--text); }
    .social-remove { color: var(--red); }
    .social-remove:hover { background: rgba(248,113,113,.1); }
    @media (max-width: 600px) {
      .social-row, .social-row-header {
        grid-template-columns: 32px 1fr 32px;
      }
      .social-icon-wrap, .social-row-header span:nth-child(3) { display: none; }
      .social-inp-url, .social-row-header span:nth-child(4) { grid-column: 2; }
    }

    /* ── TOAST ────────────────────────────────────────────── */
    .toast { position: fixed; bottom: 20px; right: 20px; background: var(--green); color: #0a2e12; padding: 11px 18px; border-radius: 10px; font-weight: 700; font-size: 13px; z-index: 200; opacity: 0; pointer-events: none; transition: opacity .25s; display: flex; align-items: center; gap: 8px; }
    .toast.err { background: var(--red); color: #3b0a0a; }
    .toast.show { opacity: 1; }
    @media (max-width: 480px) { .toast { left: 12px; right: 12px; bottom: 12px; } }
    /* ── Team admin ─────────────────────────────────── */
    .team-admin-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .member-card {
      background: var(--bg2);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      transition: border-color .2s;
    }
    .member-card:hover { border-color: var(--gold); }
    .member-card-photo {
      width: 100%; aspect-ratio: 4/3;
      background: var(--bg3);
      display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
    }
    .member-card-photo img { width:100%;height:100%;object-fit:cover;display:block; }
    .member-card-initials {
      font-size: 3rem; font-weight: 900; letter-spacing: -.05em;
      color: var(--gold); opacity: .2;
      display: flex; align-items: center; justify-content: center;
      width:100%;height:100%;
    }
    .member-founder-star {
      position:absolute;top:10px;right:10px;
      width:26px;height:26px;background:var(--gold);border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      color:#1a1a1a;font-size:.65rem;
    }
    .member-card-info { padding: 14px 16px 8px; }
    .member-card-tag {
      font-size:11px;font-family:monospace;text-transform:uppercase;
      letter-spacing:.08em;color:var(--gold);
      background:rgba(212,175,55,.08);border:1px solid rgba(212,175,55,.2);
      display:inline-block;padding:2px 8px;border-radius:99px;margin-bottom:6px;
    }
    .member-card-name { font-size:14px;font-weight:700;color:var(--text);margin-bottom:2px; }
    .member-card-role { font-size:12px;color:var(--text3); }
    .member-card-actions {
      display:flex;gap:8px;padding:10px 16px 14px;
      border-top:1px solid var(--line);margin-top:8px;
    }
    .member-card-actions .btn-secondary { flex:1;justify-content:center; }

    /* ── Modal ──────────────────────────────────────── */
    .modal-overlay {
      position:fixed;inset:0;background:rgba(0,0,0,.7);
      z-index:200;display:flex;align-items:center;justify-content:center;
      padding:16px;
    }
    .modal-box {
      background:var(--bg2);border:1px solid var(--line);border-radius:16px;
      width:100%;max-width:640px;max-height:90vh;
      display:flex;flex-direction:column;overflow:hidden;
    }
    .modal-header {
      display:flex;align-items:center;justify-content:space-between;

<!-- Firebase SDKs (compat v9) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
'use strict';

/* ══════════════════════════════════════════════════════════
   FIREBASE
══════════════════════════════════════════════════════════ */
firebase.initializeApp({
  apiKey:            "AIzaSyAOhkEtC-hwO521F3VRCqbM4AJazoiaUmw",
  authDomain:        "capessa-studios.firebaseapp.com",
  databaseURL:       "https://capessa-studios-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:         "capessa-studios",
  storageBucket:     "capessa-studios.firebasestorage.app",
  messagingSenderId: "934394598371",
  appId:             "1:934394598371:web:f40a655e7fc9db562886d6"
});
const auth    = firebase.auth();
const db      = firebase.database();

/* ══════════════════════════════════════════════════════════
   STATE
══════════════════════════════════════════════════════════ */
let currentTab = 'games';
let tabData    = {};
let sidebarCollapsed = false;

/* ══════════════════════════════════════════════════════════
   SIDEBAR — COLAPSO
══════════════════════════════════════════════════════════ */
const sidebar      = document.getElementById('sidebar');
const collapseBtn  = document.getElementById('collapse-btn');
const collapseIcon = document.getElementById('collapse-icon');
const hamburgerBtn = document.getElementById('hamburger-btn');
const overlay      = document.getElementById('sidebar-overlay');
const isMobile     = () => window.innerWidth <= 640;

function setSidebarCollapsed(collapsed) {
  sidebarCollapsed = collapsed;
  sidebar.classList.toggle('collapsed', collapsed);
  collapseIcon.className = collapsed
    ? 'fa-solid fa-chevron-right'
    : 'fa-solid fa-chevron-left';
  try { localStorage.setItem('cs-sidebar-collapsed', collapsed ? '1' : '0'); } catch(_) {}
}

collapseBtn.addEventListener('click', () => {
  if (!isMobile()) setSidebarCollapsed(!sidebarCollapsed);
});

hamburgerBtn.addEventListener('click', () => {
  if (isMobile()) {
    const open = sidebar.classList.toggle('mobile-open');
    overlay.classList.toggle('show', open);
  } else {
    setSidebarCollapsed(!sidebarCollapsed);
  }
});

overlay.addEventListener('click', () => {
  sidebar.classList.remove('mobile-open');
  overlay.classList.remove('show');
});

// Esconde footer de colapso em mobile
function updateSidebarMode() {
  const mobile = isMobile();
  document.getElementById('collapse-footer').style.display = mobile ? 'none' : '';
  if (mobile) {
    sidebar.classList.remove('collapsed');
  } else {
    sidebar.classList.remove('mobile-open');
    overlay.classList.remove('show');
    setSidebarCollapsed(sidebarCollapsed);
  }
}
window.addEventListener('resize', updateSidebarMode);

// Restaurar estado guardado
try {
  updateVisitBtn();
  const saved = localStorage.getItem('cs-sidebar-collapsed');
  if (saved === '1') setSidebarCollapsed(true);
} catch(_) {}

/* ══════════════════════════════════════════════════════════
   AUTH
══════════════════════════════════════════════════════════ */
auth.onAuthStateChanged(user => {
  if (user) {
    document.getElementById('login-screen').style.display  = 'none';
    document.getElementById('admin-app').style.display = 'block';
    document.getElementById('user-email').textContent = user.email;
    updateSidebarMode();
    loadTab(currentTab);
  } else {
    document.getElementById('login-screen').style.display  = 'flex';
    document.getElementById('admin-app').style.display = 'none';
  }
});

document.getElementById('login-btn').addEventListener('click', async () => {
  const email = document.getElementById('login-email').value.trim();
  const pw    = document.getElementById('login-pw').value;
  const errEl = document.getElementById('login-err');
  errEl.textContent = '';
  if (!email || !pw) { errEl.textContent = 'Preenche email e password.'; return; }
  try { await auth.signInWithEmailAndPassword(email, pw); }
  catch (e) {
    const bad = ['auth/invalid-credential','auth/wrong-password','auth/user-not-found'];
    errEl.textContent = bad.includes(e.code) ? 'Email ou password incorretos.' : 'Erro: ' + e.message;
  }
});

document.getElementById('login-pw').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('login-btn').click();
});

document.getElementById('google-btn').addEventListener('click', async () => {
  const errEl = document.getElementById('login-err');
  errEl.textContent = '';
  try { await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
  catch (e) {
    errEl.textContent = e.code === 'auth/popup-closed-by-user' ? 'Login cancelado.' : 'Erro: ' + e.message;
  }
});

document.getElementById('logout-btn').addEventListener('click', () => auth.signOut());

/* ══════════════════════════════════════════════════════════
   TAB NAV
══════════════════════════════════════════════════════════ */
document.querySelectorAll('.nav-btn[data-tab]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
    loadTab(currentTab);
    // Fechar drawer no mobile ao navegar
    if (isMobile()) {
      sidebar.classList.remove('mobile-open');
      overlay.classList.remove('show');
    }
  });
});

/* ══════════════════════════════════════════════════════════
   LOAD TAB
══════════════════════════════════════════════════════════ */
async function loadTab(tab) {
  const main = document.getElementById('main-content');
  main.innerHTML = '<div class="loading"><i class="fa-solid fa-circle-notch"></i> A carregar…</div>';
  try {
    if (tab === 'team') {
      const snap = await db.ref('settings/team').once('value');
      tabData['team'] = snap.val() || {};
      renderTeam(tabData['team']);
      return;
    }
    const snap = await db.ref(tab).once('value');
    const raw = snap.val();
    // Firebase devolve objecto {id: {...}, ...} ou null
    if (raw && typeof raw === 'object' && !Array.isArray(raw)) {
      tabData[tab] = raw;
    } else {
      tabData[tab] = {};
    }
    if (tab === 'settings') renderSettings(tabData[tab]);
    else                    renderList(tab, tabData[tab]);
  } catch (e) {
    main.innerHTML = `<div class="empty"><i class="fa-solid fa-triangle-exclamation"></i><span>Erro ao carregar: ${e.message}</span></div>`;
  }
}

/* ══════════════════════════════════════════════════════════
   HELPERS
══════════════════════════════════════════════════════════ */
function slugify(str) {
  return (str||'').toLowerCase().trim()
    .replace(/[àáâãä]/g,'a').replace(/[èéêë]/g,'e')
    .replace(/[ìíîï]/g,'i').replace(/[òóôõö]/g,'o')
    .replace(/[ùúûü]/g,'u').replace(/ç/g,'c')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
}

function badgeHTML(status) {
  const map = {
    released: { cls:'released', icon:'fa-circle-check',  lbl:'Lançado'       },
    beta:     { cls:'beta',     icon:'fa-flask',          lbl:'Beta'          },
    'in-dev': { cls:'dev',      icon:'fa-code',           lbl:'Em Dev'        },
    'coming-soon':{ cls:'soon', icon:'fa-clock',          lbl:'Em Breve'      },
  };
  const m = map[status] || { cls:'', icon:'fa-circle', lbl: status };
  return `<span class="badge ${m.cls}"><i class="fa-solid ${m.icon}"></i>${m.lbl}</span>`;
}

function platformChecks(list, selected = []) {
  return `<div class="check-group">${list.map(p => `
    <label class="check-chip">
      <input type="checkbox" name="platforms" value="${p}" ${selected.includes(p)?'checked':''}>${p}
    </label>`).join('')}</div>`;
}

function statusSelect(val='') {
  const opts = [['released','Lançado'],['beta','Beta'],['in-dev','Em Desenvolvimento'],['coming-soon','Em Breve']];
  return `<select name="status">${opts.map(([v,l])=>`<option value="${v}"${val===v?' selected':''}>${l}</option>`).join('')}</select>`;
}

function newsCatSelect(val='') {
  const cats = ['Lançamento','Atualização','Conteúdo','Estúdio','Evento'];
  return `<select name="category">${cats.map(c=>`<option${val===c?' selected':''}>${c}</option>`).join('')}</select>`;
}

function gameSelect(name, selected='') {
  const games = tabData.games || {};
  const opts = Object.entries(games).map(([id,g])=>
    `<option value="${id}"${selected===id?' selected':''}>${g.name}</option>`).join('');
  return `<select name="${name}"><option value="">— Nenhum —</option>${opts}</select>`;
}

function esc(str) {
  return String(str||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ══════════════════════════════════════════════════════════
   RENDER LIST
══════════════════════════════════════════════════════════ */
const TAB_META = {
  games:   { title:'Jogos',        icon:'fa-gamepad'       },
  apps:    { title:'Aplicações',   icon:'fa-mobile-screen' },
  news:    { title:'Novidades',    icon:'fa-newspaper'     },
  updates: { title:'Atualizações', icon:'fa-rotate'        },
  tools:   { title:'Tools',        icon:'fa-wrench'        },
  lab:     { title:'Lab',          icon:'fa-flask'         },
};

function renderList(tab, data) {
  const main  = document.getElementById('main-content');
  const items = Object.entries(data);
  const meta  = TAB_META[tab] || { title: tab, icon: 'fa-circle' };

  const rows = items.length ? items.map(([id, item]) => {
    const initials = ((item.name||item.title||id)).split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
    let subtitle = '';
    if (tab==='games'||tab==='apps') subtitle = `${item.category||''}  ·  v${item.version||''}`;
    if (tab==='tools') subtitle = `${item.category||''}${item.version ? ' · v'+item.version : ''}`;
    if (tab==='lab') subtitle = `${item.category||''}`;
    if (tab==='news')    subtitle = `${item.category||''} · ${item.date||''}`;
    if (tab==='updates') subtitle = `${item.gameId||''} · v${item.version||''} · ${item.date||''}`;
    const badge = (tab==='games'||tab==='apps'||tab==='tools'||tab==='lab') ? badgeHTML(item.status) : '';
    const colorStyle = item.color ? `background:${item.color}22;color:${item.color}` : '';
    return `
      <div class="item-row">
        <div class="item-thumb" style="${colorStyle}">${esc(initials)}</div>
        <div class="item-info">
          <b>${esc(item.name||item.title||id)} ${badge}</b>
          <span>${esc(subtitle)}</span>
        </div>
        <div class="item-actions">
          <button class="btn-edit"   onclick="openModal('${tab}','${id}')"><i class="fa-solid fa-pen-to-square"></i> Editar</button>
          <button class="btn-danger" onclick="deleteItem('${tab}','${id}')"><i class="fa-solid fa-trash"></i></button>
        </div>
      </div>`;
  }).join('') : `<div class="empty"><i class="fa-solid fa-${meta.icon}"></i><span>Sem itens. Clica em "+ Novo" para adicionar.</span></div>`;

  main.innerHTML = `
    <div class="toolbar">
      <h2><i class="fa-solid fa-${meta.icon}" style="color:var(--gold);margin-right:8px;font-size:.9em;"></i>${meta.title}</h2>
      <div class="toolbar-actions">
        <button class="btn-primary" onclick="openModal('${tab}',null)"><i class="fa-solid fa-plus"></i> Novo</button>
      </div>
    </div>
    ${rows}`;
}

/* ══════════════════════════════════════════════════════════
   FORM — GAMES
══════════════════════════════════════════════════════════ */

const FORM_ICONS = { games:'fa-gamepad', apps:'fa-mobile-screen', news:'fa-newspaper', updates:'fa-rotate', tools:'fa-wrench', lab:'fa-flask' };

async function openModal(tab, id) {
  if (!tabData.games) {
    const snap = await db.ref('games').once('value');
    tabData.games = snap.val() || {};
  }
  const isNew  = !id;
  const d      = isNew ? {} : (tabData[tab]?.[id] || {});
  const label  = { games:'Jogo', apps:'Aplicação', news:'Notícia', updates:'Atualização', tools:'Tool', lab:'Lab' }[tab];
  const icon   = FORM_ICONS[tab] || 'fa-circle';
  const formMap = { games: gameFormHTML, apps: appFormHTML, news: newsFormHTML, updates: updatesFormHTML, tools: toolFormHTML, lab: labFormHTML };

  const box = document.getElementById('modal-box');
  box.innerHTML = `
    <div class="modal-header">
      <i class="fa-solid ${icon}" style="color:var(--gold)"></i>
      <h3>${isNew ? 'Novo' : 'Editar'} ${label}</h3>
      <button class="btn-icon" onclick="closeModal()" title="Fechar"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <form id="item-form" onsubmit="return false">${formMap[tab](id, d)}</form>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()"><i class="fa-solid fa-xmark"></i> Cancelar</button>
      <button class="btn-primary" onclick="saveItem('${tab}','${esc(id||'')}')"><i class="fa-solid fa-floppy-disk"></i> Guardar</button>
    </div>`;

  document.getElementById('modal-bg').classList.add('open');

  // Auto-slug
  if (isNew) {
    const nameEl = box.querySelector('[name="name"],[name="title"]');
    const idEl   = box.querySelector('[name="id"]');
    if (nameEl && idEl) nameEl.addEventListener('input', () => { idEl.value = slugify(nameEl.value); });
    if (tab === 'updates') {
      const gEl = box.querySelector('[name="gameId"]');
      const vEl = box.querySelector('[name="version"]');
      const sync = () => { if (gEl.value||vEl.value) idEl.value = slugify(`${gEl.value}-${vEl.value}`); };
      gEl?.addEventListener('change', sync);
      vEl?.addEventListener('input', sync);
    }
  }

  // Color picker sync
  const pick = box.querySelector('[name="color_pick"]');
  const hex  = box.querySelector('[name="color_hex"]');
  if (pick && hex) {
    pick.addEventListener('input', () => { hex.value = pick.value; });
    hex.addEventListener('input', () => { if (/^#[0-9a-fA-F]{6}$/.test(hex.value)) pick.value = hex.value; });
  }
}

function closeModal() {
  document.getElementById('modal-bg').classList.remove('open');
}

document.getElementById('modal-bg').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-bg')) closeModal();
});

/* ══════════════════════════════════════════════════════════
   COLLECT FORM
══════════════════════════════════════════════════════════ */
function collectForm(tab, form) {
  const v   = n => (form.querySelector(`[name="${n}"]`)?.value || '').trim();
  const chk = n => form.querySelector(`[name="${n}"]`)?.checked || false;
  const arr = n => v(n).split('\n').map(s=>s.trim()).filter(Boolean);
  const csv = n => v(n).split(',').map(s=>s.trim()).filter(Boolean);
  const plat = () => [...form.querySelectorAll('[name="platforms"]:checked')].map(el=>el.value);
  let id = v('id') || slugify(v('name') || v('title') || String(Date.now()));

  if (tab === 'games') return { id, obj: {
    id, name: v('name'), type:'game', category: v('category'),
    status: v('status'), version: v('version'), size: v('size'),
    releaseDate: v('releaseDate'), developer: v('developer'),
    description: v('description'), shortDesc: v('shortDesc'),
    image: v('image'), icon: v('icon'),
    color: v('color_hex') || v('color_pick'),
    featured: chk('featured'), platforms: plat(),
    links: collectLinks(form),
    features: arr('features'), tags: csv('tags'),
    trailer: v('trailer'), screenshots: arr('screenshots'),
  }};

  if (tab === 'apps') return { id, obj: {
    id, name: v('name'), type:'app', category: v('category'),
    status: v('status'), version: v('version'), size: v('size'),
    releaseDate: v('releaseDate'), developer: v('developer'),
    description: v('description'), shortDesc: v('shortDesc'),
    image: v('image'), icon: v('icon'),
    color: v('color_hex') || v('color_pick'),
    featured: chk('featured'), platforms: plat(),
    links: collectLinks(form),
    features: arr('features'), tags: csv('tags'), screenshots: arr('screenshots'),
  }};

  if (tab === 'news') {
    const title = v('title');
    if (!id) id = slugify(title);
    return { id, obj: {
      id, title, category: v('category'), categoryIcon: v('categoryIcon'),
      date: v('date'), summary: v('summary'), content: v('content'),
      image: v('image'), game: v('game') || null,
      tags: csv('tags'), featured: chk('featured'),
    }};
  }

  if (tab === 'updates') {
    const gameId = v('gameId'), version = v('version');
    if (!id) id = slugify(`${gameId}-${version}`);
    return { id, obj: {
      id, gameId, version, date: v('date'),
      title: v('title'), changes: arr('changes'),
    }};
  }

  if (tab === 'tools') return { id, obj: {
    id, name: v('name'), type:'tool', category: v('category'),
    status: v('status'), version: v('version'),
    description: v('description'), shortDesc: v('shortDesc'),
    image: v('image'), icon: v('icon'),
    color: v('color_hex') || v('color_pick'),
    url: v('url'), featured: chk('featured'),
    tags: csv('tags'), features: arr('features'),
    screenshots: arr('screenshots'), github: v('link_github'),
  }};

  if (tab === 'lab') return { id, obj: {
    id, name: v('name'), type:'lab', category: v('category'),
    status: v('status'),
    description: v('description'), shortDesc: v('shortDesc'),
    image: v('image'), icon: v('icon'),
    color: v('color_hex') || v('color_pick'),
    url: v('url'), featured: chk('featured'),
    tags: csv('tags'), features: arr('features'),
    screenshots: arr('screenshots'), github: v('link_github'),
  }};
}

/* ══════════════════════════════════════════════════════════
   SAVE
══════════════════════════════════════════════════════════ */
async function saveItem(tab, existingId) {
  const form = document.getElementById('item-form');
  const { id, obj } = collectForm(tab, form);
  if (!id) { showToast('ID em falta.', true); return; }
  try {
    await db.ref(`${tab}/${id}`).set(obj);
    if (!tabData[tab]) tabData[tab] = {};
    tabData[tab][id] = obj;
    closeModal();
    renderList(tab, tabData[tab]);
    showToast('Guardado com sucesso');
  } catch (e) {
    showToast('Erro: ' + e.message, true);
  }
}

/* ══════════════════════════════════════════════════════════
   DELETE
══════════════════════════════════════════════════════════ */
async function deleteItem(tab, id) {
  if (!confirm(`Apagar "${id}"?\nEsta ação não pode ser desfeita.`)) return;
  try {
    await db.ref(`${tab}/${id}`).remove();
    delete tabData[tab][id];
    renderList(tab, tabData[tab]);
    showToast('Item apagado.');
  } catch (e) {
    showToast('Erro: ' + e.message, true);
  }
}

/* ── SOCIAL ICON SUGGESTIONS ─────────────────────────────── */
const SOCIAL_SUGGESTIONS = [
  { label:'GitHub',       icon:'fab fa-github'    },
  { label:'YouTube',      icon:'fab fa-youtube'   },
  { label:'itch.io',      icon:'fab fa-itch-io'   },
  { label:'Twitter / X',  icon:'fab fa-x-twitter' },
  { label:'Instagram',    icon:'fab fa-instagram' },
  { label:'Facebook',     icon:'fab fa-facebook'  },
  { label:'TikTok',       icon:'fab fa-tiktok'    },
  { label:'WhatsApp',     icon:'fab fa-whatsapp'  },
  { label:'Telegram',     icon:'fab fa-telegram'  },
  { label:'Discord',      icon:'fab fa-discord'   },
  { label:'LinkedIn',     icon:'fab fa-linkedin'  },
  { label:'Twitch',       icon:'fab fa-twitch'    },
  { label:'Reddit',       icon:'fab fa-reddit'    },
  { label:'Email',        icon:'fas fa-envelope'  },
  { label:'Website',      icon:'fas fa-globe'     },
];

/* Migra o formato antigo {github:'url',...} para array novo */
function migrateSocial(raw) {
  if (Array.isArray(raw)) return raw;
  if (!raw || typeof raw !== 'object') return [];
  const iconMap = {
    github:'fab fa-github', itchio:'fab fa-itch-io',
    twitter:'fab fa-x-twitter', youtube:'fab fa-youtube',
  };
  return Object.entries(raw)
    .filter(([,url]) => url)
    .map(([key, url]) => ({
      label: key.charAt(0).toUpperCase() + key.slice(1),
      icon:  iconMap[key] || 'fas fa-link',
      url,
    }));
}

function socialRowHTML(item={}, idx) {
  const iconVal  = item.icon  || 'fas fa-link';
  const labelVal = item.label || '';
  const urlVal   = item.url   || '';

  // Opções do selector de ícone
  const iconOptions = SOCIAL_SUGGESTIONS.map(s =>
    `<option value="${s.icon}" ${s.icon === iconVal ? 'selected' : ''}>${s.label}</option>`
  ).join('');

  return `
    <div class="social-row" data-idx="${idx}">
      <div class="social-row-icon">
        <i class="${esc(iconVal)} social-preview-icon"></i>
      </div>
      <input class="social-inp-label" placeholder="Nome (ex: WhatsApp)" value="${esc(labelVal)}"
        list="social-suggestions" oninput="socialAutoIcon(this,${idx})">
      <div class="social-icon-wrap">
        <i class="${esc(iconVal)} social-icon-preview-sel"></i>
        <select class="social-inp-icon" onchange="socialUpdatePreview(this,${idx})">
          <option value="fas fa-link" ${iconVal==='fas fa-link'?'selected':''}>— ícone —</option>
          ${iconOptions}
        </select>
      </div>
      <input class="social-inp-url" placeholder="URL, número, username..." value="${esc(urlVal)}">
      <button class="btn-icon social-remove" onclick="removeSocialRow(${idx})" title="Remover">
        <i class="fa-solid fa-trash"></i>
      </button>
    </div>`;
}

function renderSocialList(list) {
  const container = document.getElementById('social-list');
  if (!container) return;
  container.innerHTML = list.length
    ? list.map((item, i) => socialRowHTML(item, i)).join('')
    : '<div class="empty" style="padding:20px;font-size:12px;"><i class="fa-solid fa-share-nodes"></i><span>Sem redes sociais. Clica em "+ Adicionar".</span></div>';
}

function addSocialRow() {
  const container = document.getElementById('social-list');
  const current = collectSocialList();
  current.push({ label:'', icon:'fas fa-link', url:'' });
  renderSocialList(current);
}

function removeSocialRow(idx) {
  const list = collectSocialList();
  list.splice(idx, 1);
  renderSocialList(list);
}

function collectSocialList() {
  const rows = document.querySelectorAll('#social-list .social-row');
  return [...rows].map(row => ({
    label: row.querySelector('.social-inp-label')?.value.trim() || '',
    icon:  row.querySelector('.social-inp-icon')?.value || 'fas fa-link',
    url:   row.querySelector('.social-inp-url')?.value.trim()   || '',
  })).filter(r => r.label || r.url);
}

/* ── Founder social — mesma estrutura, container separado ── */
function renderFounderSocialList(list) {
  const container = document.getElementById('founder-social-list');
  if (!container) return;
  container.innerHTML = list.length
    ? list.map((item, i) => founderSocialRowHTML(item, i)).join('')
    : '<div class="empty" style="padding:20px;font-size:12px;"><i class="fa-solid fa-user-pen"></i><span>Sem redes do fundador. Clica em "+ Adicionar".</span></div>';

function founderSocialRowHTML(item={}, idx) {
  const iconVal  = item.icon  || 'fas fa-link';
  const labelVal = item.label || '';
  const urlVal   = item.url   || '';
  const iconOptions = SOCIAL_SUGGESTIONS.map(s =>
    `<option value="${s.icon}" ${s.icon === iconVal ? 'selected' : ''}>${s.label}</option>`
  ).join('');
  return `
    <div class="social-row" data-idx="${idx}">
      <div class="social-row-icon">
        <i class="${esc(iconVal)} social-preview-icon"></i>
      </div>

        <i class="${esc(iconVal)} social-icon-preview-sel"></i>
        <select class="social-inp-icon" onchange="founderSocialUpdatePreview(this,${idx})">
          <option value="fas fa-link" ${iconVal==='fas fa-link'?'selected':''}>— ícone —</option>
          ${iconOptions}
        </select>
      </div>
      <input class="social-inp-url" placeholder="URL, número, username..." value="${esc(urlVal)}">
      <button class="btn-icon social-remove" onclick="removeFounderSocialRow(${idx})" title="Remover">
        <i class="fa-solid fa-trash"></i>
      </button>
    </div>`;
}

function addFounderSocialRow() {
  const current = collectFounderSocialList();
  current.push({ label:'', icon:'fas fa-link', url:'' });
  renderFounderSocialList(current);
}

function removeFounderSocialRow(idx) {
  const list = collectFounderSocialList();
  list.splice(idx, 1);
  renderFounderSocialList(list);
}

function collectFounderSocialList() {
  const rows = document.querySelectorAll('#founder-social-list .social-row');
  return [...rows].map(row => ({
    label: row.querySelector('.social-inp-label')?.value.trim() || '',
    icon:  row.querySelector('.social-inp-icon')?.value || 'fas fa-link',
    url:   row.querySelector('.social-inp-url')?.value.trim()   || '',
  })).filter(r => r.label || r.url);
}

function founderSocialAutoIcon(labelInput, idx) {
  const val   = labelInput.value.trim().toLowerCase();
  const match = SOCIAL_SUGGESTIONS.find(s =>
    s.label.toLowerCase() === val || s.label.toLowerCase().startsWith(val)
  );
  if (!match) return;
  const row = labelInput.closest('.social-row');
  const iconSel = row.querySelector('.social-inp-icon');
  if (iconSel) { iconSel.value = match.icon; founderSocialUpdatePreview(iconSel, idx); }
}

function founderSocialUpdatePreview(iconEl, idx) {
  const row = iconEl.closest('.social-row');
  const cls = (iconEl.value || 'fas fa-link').trim();
  const bigPreview = row.querySelector('.social-preview-icon');
  if (bigPreview) bigPreview.className = cls + ' social-preview-icon';
  const selPreview = row.querySelector('.social-icon-preview-sel');
  if (selPreview) selPreview.className = cls + ' social-icon-preview-sel';
}

function socialAutoIcon(labelInput, idx) {
  const val   = labelInput.value.trim().toLowerCase();
  const match = SOCIAL_SUGGESTIONS.find(s =>
    s.label.toLowerCase() === val || s.label.toLowerCase().startsWith(val)
  );
  if (!match) return;
  const row      = labelInput.closest('.social-row');
  const iconSel  = row.querySelector('.social-inp-icon');
  // Preenche sempre — substitui o ícone ao mudar o nome
  if (iconSel) {
    iconSel.value = match.icon;
    socialUpdatePreview(iconSel, idx);
  }
}

function socialUpdatePreview(iconEl, idx) {
  const row  = iconEl.closest('.social-row');
  const cls  = (iconEl.value || 'fas fa-link').trim();
  // Preview no quadrado esquerdo
  const bigPreview = row.querySelector('.social-preview-icon');
  if (bigPreview) bigPreview.className = cls + ' social-preview-icon';
  // Preview dentro do select
  const selPreview = row.querySelector('.social-icon-preview-sel');
  if (selPreview) selPreview.className = cls + ' social-icon-preview-sel';
}

async function saveSettings() {
  const v = id => (document.getElementById(id)?.value||'').trim();
  const n = id => Number(document.getElementById(id)?.value)||0;
  const data = {
    studio: {
      founder: v('s-founder'), founded: v('s-founded'),
      founderPhoto: v('s-founder-photo'),
      tagline: v('s-tagline'), description: v('s-description'), email: v('s-email'),
      social: collectSocialList(),
      founderSocial: collectFounderSocialList(),
    },
    stats: { games: n('s-games'), downloads: n('s-downloads'), platforms: n('s-platforms'), founded: n('s-stat-founded') },
  };
  try {
    await db.ref('settings').set(data);
    tabData.settings = data;
    showToast('Configurações guardadas');
  } catch (e) {
    showToast('Erro: ' + e.message, true);
  }
}

function autoSlug() {

  const div = document.createElement('div');

function collectMemberSocialList() {
  return [...document.querySelectorAll('#m-social-list .social-row')].map(row => ({

    icon:  row.querySelector('.ms-icon')?.value.trim()||'',

}

function closeMemberForm(e) {
  if (e && e.target !== document.getElementById('team-modal-overlay')) return;
  document.getElementById('team-modal-overlay').style.display = 'none';
}

async function saveMember(existingId) {
  const v = id => (document.getElementById(id)?.value||'').trim();
  const name = v('m-name');
  if (!name) { showToast('O nome é obrigatório', true); return; }

  const idEl = document.getElementById('m-id');
  idEl.dataset.manual = '1';
  const id = v('m-id') || slugify(name);

  const member = {
    id,
    name,
    role:     v('m-role'),
    roleTag:  v('m-roletag') || v('m-role'),
    roleIcon: v('m-roleicon') || 'fas fa-user',
    bio:      v('m-bio'),
    photo:    v('m-photo'),
    order:    Number(document.getElementById('m-order')?.value)||99,
    social:   collectMemberSocialList(),
  };

  try {
    await db.ref(`settings/team/${id}`).set(member);
    // Remove entrada antiga se o ID mudou
    if (existingId && existingId !== id) {
      await db.ref(`settings/team/${existingId}`).remove();
    }
    // Refresh
    const snap = await db.ref('settings/team').once('value');
    tabData['team'] = snap.val() || {};
    renderTeam(tabData['team']);
    showToast(existingId ? 'Membro atualizado' : 'Membro adicionado');
  } catch (e) {
    showToast('Erro: ' + e.message, true);
  }
}

async function deleteMember(id, name) {
  if (!confirm(`Remover "${name}" da equipa?`)) return;
  try {
    await db.ref(`settings/team/${id}`).remove();
    const snap = await db.ref('settings/team').once('value');
    tabData['team'] = snap.val() || {};
    renderTeam(tabData['team']);
    showToast('Membro removido');
  } catch (e) {
    showToast('Erro: ' + e.message, true);
  }
}

let toastTimer;
function showToast(msg, isErr=false) {
  const t   = document.getElementById('toast');
  const ico = document.getElementById('toast-icon');
  const txt = document.getElementById('toast-msg');
  txt.textContent = msg;
  ico.className   = isErr ? 'fa-solid fa-circle-exclamation' : 'fa-solid fa-circle-check';
  t.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = 'toast'; }, 3200);
}

/* Mostra preview ao colar URL manualmente */
function syncPreview(previewId, url) {

}

/* ══════════════════════════════════════════════════════════
   CLOUDINARY — UPLOAD DE IMAGENS (gratuito, sem Storage)
══════════════════════════════════════════════════════════ */
const CLD_CLOUD  = 'oj7kldra';
const CLD_PRESET = 'capessastudios_upload';
const CLD_URL    = `https://api.cloudinary.com/v1_1/${CLD_CLOUD}/image/upload`;

async function cloudinaryUpload(file, folder, onProgress) {
  const fd = new FormData();
  fd.append('file', file);
  fd.append('upload_preset', CLD_PRESET);
  fd.append('folder', 'capessa/' + folder);

  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', CLD_URL);
    xhr.upload.onprogress = e => {
      if (e.lengthComputable && onProgress)
        onProgress(Math.round(e.loaded / e.total * 100));
    };
    xhr.onload = () => {
      const res = JSON.parse(xhr.responseText);
      if (res.secure_url) resolve(res.secure_url);
      else reject(new Error(res.error?.message || 'Erro no upload'));
    };
    xhr.onerror = () => reject(new Error('Erro de rede'));
    xhr.send(fd);
  });
}

/* Mostra preview ao colar URL manualmente */
function syncPreview(previewId, url) {
  const img = document.getElementById(previewId);
  if (!img) return;
  if (url) { img.src = url; img.classList.add('show'); }
  else { img.classList.remove('show'); }
}

/* Upload de capa ou ícone */
function triggerUpload(fileInputId, folder, filename, targetInputId, previewId, progressId) {
  const fileInput = document.getElementById(fileInputId);
  if (!fileInput) return;
  fileInput.onchange = async () => {
    const file = fileInput.files[0];
    if (!file) return;
    const prog = document.getElementById(progressId);
    if (prog) { prog.textContent = 'A enviar…'; prog.classList.add('show'); }
    try {
      const url = await cloudinaryUpload(file, folder, pct => {
        if (prog) prog.textContent = `A enviar… ${pct}%`;
      });
      const inp = document.getElementById(targetInputId);
      if (inp) { inp.value = url; syncPreview(previewId, url); }
      if (prog) { prog.textContent = 'Upload concluído ✓'; setTimeout(() => prog.classList.remove('show'), 2500); }
      showToast('Imagem enviada com sucesso!');
    } catch (e) {
      if (prog) { prog.textContent = 'Erro: ' + e.message; }
      showToast('Erro no upload: ' + e.message, true);
    }
    fileInput.value = '';
  };
  fileInput.click();
}

/* Upload de múltiplos screenshots */
function triggerScreensUpload(fileInputId, folder, textareaId, listId, progressId) {
  const fileInput = document.getElementById(fileInputId);
  if (!fileInput) return;
  fileInput.onchange = async () => {
    const files = Array.from(fileInput.files);
    if (!files.length) return;
    const prog     = document.getElementById(progressId);
    const textarea = document.getElementById(textareaId);
    const list     = document.getElementById(listId);
    if (prog) { prog.textContent = `A enviar 0 / ${files.length}…`; prog.classList.add('show'); }

    const existing = textarea ? textarea.value.trim().split('\n').filter(Boolean) : [];
    const newUrls  = [];

    for (let i = 0; i < files.length; i++) {
      try {
        const url = await cloudinaryUpload(files[i], folder + '/screenshots', pct => {
          if (prog) prog.textContent = `Screenshot ${i + 1}/${files.length} — ${pct}%`;
        });
        newUrls.push(url);
      } catch (e) {
        showToast(`Erro screenshot ${i + 1}: ${e.message}`, true);
      }
    }

    const allUrls = [...existing, ...newUrls].filter(Boolean);
    if (textarea) textarea.value = allUrls.join('\n');
    if (list) list.innerHTML = allUrls.map(u => `<img src="${u}" title="${u}">`).join('');
    if (prog) { prog.textContent = `${newUrls.length} screenshot(s) enviado(s) ✓`; setTimeout(() => prog.classList.remove('show'), 3000); }
    showToast(`${newUrls.length} screenshot(s) enviado(s)!`);
    fileInput.value = '';
  };
  fileInput.click();
}

const CTA_OPTIONS = [
  { value:'',          label:'Só na grelha' },

function linksIconSelect(current='') {
  return `<select class="link-col-icon" onchange="linkUpdatePreview(this)">
    ${LINK_SUGGESTIONS.map(o=>`<option value="${o.icon}" ${current===o.icon?'selected':''}>${o.label}</option>`).join('')}

  </select>`;
}

function linksCtaSelect(current='') {
  return `<select class="link-col-cta">
    ${CTA_OPTIONS.map(o=>`<option value="${o.value}" ${current===o.value?'selected':''}>${o.label}</option>`).join('')}
  </select>`;
}

function linkRowHTML(link={}) {
  return `<div class="link-row">
    <div style="display:flex;align-items:center;gap:6px;">
      <i class="${link.icon||'fas fa-download'} link-icon-preview" style="color:var(--gold);width:14px;text-align:center;flex-shrink:0;"></i>
      <input type="text" list="link-suggestions" placeholder="Label"
        value="${esc(link.label||'')}"
        oninput="linkAutoDetect(this)"
        style="flex:1">
    </div>
    <input type="url" placeholder="https://..." value="${esc(link.url||'')}"
      oninput="linkAutoDetectByUrl(this)">
    ${linksIconSelect(link.icon||'fas fa-download')}
    ${linksCtaSelect(link.cta||'')}
    <button type="button" class="link-row-del" onclick="this.closest('.link-row').remove()" title="Remover">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>`;
}

function linksFieldHTML(linksRaw, prefix) {
  let arr = [];
  if (Array.isArray(linksRaw)) {
    arr = linksRaw;
  } else if (linksRaw && typeof linksRaw === 'object') {
    const lk = linksRaw;
    if (lk.play)     arr.push({ label:'Web / Jogar Online', url:lk.play,     icon:'fas fa-globe',       cta:'primary' });
    if (lk.download) arr.push({ label:'Download',           url:lk.download, icon:'fas fa-download',    cta:'secondary' });
    if (lk.itchio)   arr.push({ label:'itch.io',            url:lk.itchio,   icon:'fab fa-itch-io',     cta:'' });
    if (lk.github)   arr.push({ label:'GitHub',             url:lk.github,   icon:'fab fa-github',      cta:'' });
    if (lk.store)    arr.push({ label:'Google Play',        url:lk.store,    icon:'fab fa-google-play', cta:'' });
  }

  const rows = arr.map(l => linkRowHTML(l)).join('');
  const suggestions = LINK_SUGGESTIONS.map(s => `<option value="${s.label}">`).join('');
  return `
    <datalist id="link-suggestions">${suggestions}</datalist>
    <div class="link-rows" id="link-rows-${prefix}">${rows}</div>
    <button type="button" class="btn-add-link" onclick="addLinkRow('link-rows-${prefix}')">
      <i class="fa-solid fa-plus"></i> Adicionar link
    </button>
    <small style="color:var(--text3);font-size:11px;margin-top:4px;display:block;">
      "Botão principal" e "Botão secundário" aparecem em destaque no hero. Os restantes aparecem na grelha de plataformas.
    </small>`;
}

function addLinkRow(containerId) {
  const container = document.getElementById(containerId);
  if (!container) return;
  container.insertAdjacentHTML('beforeend', linkRowHTML());
}

/* Auto-deteção pelo label digitado */
function linkAutoDetect(labelInput) {
  const val   = labelInput.value.trim().toLowerCase();
  if (!val) return;
  const match = LINK_SUGGESTIONS.find(s =>
    s.label.toLowerCase().startsWith(val) ||
    val.includes(s.label.toLowerCase().split(' ')[0])
  );
  if (!match) return;
  const row = labelInput.closest('.link-row');
  const sel = row.querySelector('.link-col-icon');
  if (sel) { sel.value = match.icon; linkUpdatePreview(sel); }
}

/* Auto-deteção pelo URL colado */
function linkAutoDetectByUrl(urlInput) {
  const url = urlInput.value.trim().toLowerCase();
  if (!url) return;
  const match = LINK_SUGGESTIONS.find(s => s.urlHint && url.includes(s.urlHint));
  if (!match) return;
  const row      = urlInput.closest('.link-row');
  const sel      = row.querySelector('.link-col-icon');
  const labelInp = row.querySelector('input[list="link-suggestions"]');
  if (sel) { sel.value = match.icon; linkUpdatePreview(sel); }
  if (labelInp && !labelInp.value.trim()) labelInp.value = match.label;
}

/* Atualiza ícone de preview ao mudar o select */
function linkUpdatePreview(iconSelect) {
  const row     = iconSelect.closest('.link-row');
  const preview = row.querySelector('.link-icon-preview');
  if (preview) preview.className = (iconSelect.value || 'fas fa-download') + ' link-icon-preview';
}

function collectLinks(form) {
  const rows  = form.querySelectorAll('.link-row');
  const links = [];
  rows.forEach(row => {
    const labelInp = row.querySelector('input[list="link-suggestions"]');
    const urlInp   = row.querySelector('input[type="url"]');
    const iconSel  = row.querySelector('.link-col-icon');
    const ctaSel   = row.querySelector('.link-col-cta');
    const label = labelInp?.value.trim();
    const url   = urlInp?.value.trim();
    if (!label && !url) return;
    links.push({
      label: label || 'Link',
      url:   url   || '',
      icon:  iconSel?.value || 'fas fa-download',
      cta:   ctaSel?.value  || '',
    });
  });
  return links;
}

/* ══ VISITAR SITE ════════════════════════════════════════════
   Abre o site numa nova aba.
   Prioridade:
     1. URL guardado pelo utilizador (localStorage cs-site-url)
     2. Fallback automático: ../index.html (quando admin é local)
════════════════════════════════════════════════════════════ */
const SITE_URL_KEY = 'cs-site-url';

function getSiteUrl() {
  try { return localStorage.getItem(SITE_URL_KEY) || ''; } catch(_) { return ''; }
}

function saveSiteUrl(val) {
  try {
    const clean = (val || '').trim().replace(/\/$/, '');
    if (clean) localStorage.setItem(SITE_URL_KEY, clean);
    else        localStorage.removeItem(SITE_URL_KEY);
    updateVisitBtn();
  } catch(_) {}
}

function visitSite() {
  const stored = getSiteUrl();
  const url    = stored || '../index.html';
  window.open(url, '_blank', 'noopener,noreferrer');
}

function updateVisitBtn() {
  const btn    = document.getElementById('visit-site-btn');
  const label  = btn?.querySelector('.vb-label');
  const stored = getSiteUrl();
  if (label) label.textContent = stored ? 'Ver Site ↗' : 'Visitar Site ↗';
  if (btn)   btn.title = stored ? `Abre: ${stored}` : 'Abre index.html local';
  // Sync the input field if it's visible on screen
  const input = document.getElementById('admin-site-url');
  if (input && input.value !== stored) input.value = stored;
}

function escAttr(str) {
  return (str || '').toString()
    .replace(/&/g,'&amp;').replace(/"/g,'&quot;')
    .replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Call on load
window.addEventListener('load', updateVisitBtn);
